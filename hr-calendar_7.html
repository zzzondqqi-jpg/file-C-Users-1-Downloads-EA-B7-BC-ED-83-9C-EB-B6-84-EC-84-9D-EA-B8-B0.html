<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인사팀 업무 캘린더</title>
<style>
:root {
  --navy:#0F1C2E; --navy2:#1A2E45; --navy3:#243B55;
  --accent:#4E9AF1; --accent2:#7BB8F5;
  --bg:#F0F4F8; --card:#FFFFFF;
  --border:#D9E2EC; --text:#1A2E45; --text2:#486581; --text3:#829AB1;
  --row-alt:#F7FAFC; --ok:#48BB78;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif; background:var(--bg); color:var(--text); font-size:14px; }
.app-header { background:var(--navy); padding:0 28px; display:flex; align-items:center; gap:12px; height:54px; }
.logo-bar { width:3px; height:26px; background:linear-gradient(180deg,var(--accent),var(--accent2)); border-radius:2px; }
.app-header h1 { color:#fff; font-size:16px; font-weight:600; }
.header-right { margin-left:auto; display:flex; align-items:center; gap:8px; }
.header-badge { font-size:11px; color:#A8D4FF; background:rgba(78,154,241,.15); padding:3px 10px; border-radius:100px; border:1px solid rgba(78,154,241,.2); }
.sync-status { font-size:11px; padding:3px 10px; border-radius:100px; }
.sync-status.ok { color:#9AE6B4; background:rgba(72,187,120,.1); }
.sync-status.saving { color:#FBD38D; background:rgba(240,160,75,.1); }
.sync-status.err { color:#FEB2B2; background:rgba(224,92,92,.1); }
.container { max-width:1100px; margin:0 auto; padding:20px 16px; }
.month-tabs { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:18px; }
.month-tab { font-size:12px; font-weight:600; padding:5px 13px; border-radius:100px; border:1.5px solid var(--border); background:var(--card); color:var(--text2); cursor:pointer; transition:all .1s; position:relative; }
.month-tab:hover { border-color:var(--accent); color:var(--accent); }
.month-tab.active { background:var(--navy2); color:#fff; border-color:var(--navy2); }
.month-tab.has-done::after { content:''; position:absolute; top:2px; right:2px; width:6px; height:6px; background:var(--ok); border-radius:50%; }
.toolbar { display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.search-input { font-size:13px; padding:7px 12px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); width:190px; }
.filter-sel { font-size:12px; padding:6px 10px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text2); }
.btn { display:inline-flex; align-items:center; gap:5px; padding:6px 13px; border-radius:8px; font-size:12px; font-weight:500; cursor:pointer; border:1px solid var(--border); background:var(--card); color:var(--text2); transition:all .1s; white-space:nowrap; }
.btn:hover { background:var(--bg); }
.btn-primary { background:var(--navy2); color:#fff; border-color:var(--navy2); }
.btn-primary:hover { background:var(--navy3); }
.progress-info { display:flex; justify-content:space-between; font-size:12px; color:var(--text3); margin-bottom:5px; }
.progress-bar-wrap { background:#E2E8F0; border-radius:100px; height:5px; margin-bottom:18px; overflow:hidden; }
.progress-bar { height:100%; background:linear-gradient(90deg,var(--accent),var(--ok)); border-radius:100px; transition:width .3s; }
.category-section { margin-bottom:14px; }
.category-header { display:flex; align-items:center; gap:8px; padding:9px 14px; background:var(--navy2); border-radius:10px 10px 0 0; cursor:pointer; user-select:none; }
.cat-title { font-size:13px; font-weight:700; color:#fff; flex:1; }
.cat-count { font-size:11px; color:var(--accent2); background:rgba(78,154,241,.15); padding:1px 8px; border-radius:100px; }
.cat-btn { font-size:11px; padding:2px 8px; border-radius:5px; border:1px solid rgba(255,255,255,.2); background:transparent; color:#A8D4FF; cursor:pointer; }
.cat-btn:hover { background:rgba(255,255,255,.1); }
.task-list { border:1px solid var(--border); border-top:none; border-radius:0 0 10px 10px; overflow:hidden; }
.task-item { display:flex; align-items:flex-start; gap:11px; padding:11px 14px; border-bottom:1px solid var(--border); background:var(--card); transition:background .1s; }
.task-item:last-child { border-bottom:none; }
.task-item:hover { background:var(--row-alt); }
.task-item.done { background:#F0FFF4; }
.task-item.done .task-title { text-decoration:line-through; color:var(--text3); }
.task-item.done .task-detail { color:#9AE6B4; }
.task-check { width:17px; height:17px; border-radius:5px; border:2px solid var(--border); cursor:pointer; flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; transition:all .15s; }
.task-check.checked { background:var(--ok); border-color:var(--ok); }
.task-check.checked::after { content:'✓'; color:#fff; font-size:10px; font-weight:700; }
.task-body { flex:1; min-width:0; }
.task-header { display:flex; align-items:center; gap:7px; margin-bottom:2px; flex-wrap:wrap; }
.task-title { font-size:13px; font-weight:600; color:var(--text); }
.task-badge { font-size:10px; padding:1px 6px; border-radius:100px; font-weight:600; }
.b-monthly { background:#F0FFF4; color:#276749; border:1px solid #9AE6B4; }
.b-special { background:#FFF5F5; color:#C53030; border:1px solid #FED7D7; }
.b-regular { background:#EBF8FF; color:#2B6CB0; border:1px solid #BEE3F8; }
.task-detail { font-size:12px; color:var(--text2); line-height:1.5; white-space:pre-wrap; }
.task-actions { display:flex; gap:4px; flex-shrink:0; opacity:0; transition:opacity .1s; }
.task-item:hover .task-actions { opacity:1; }
.tact-btn { font-size:11px; padding:2px 7px; border-radius:5px; border:1px solid var(--border); background:var(--card); cursor:pointer; color:var(--text3); }
.tact-btn:hover { background:var(--bg); color:var(--text); }
.tact-btn.del:hover { background:#FFF5F5; color:#C53030; border-color:#FED7D7; }
.add-form { padding:11px 14px; background:var(--row-alt); border:1px solid var(--border); border-top:none; border-radius:0 0 10px 10px; display:none; }
.add-form.open { display:block; }
.form-row { display:flex; gap:7px; margin-bottom:7px; flex-wrap:wrap; }
.form-input { flex:1; font-size:13px; padding:6px 10px; border-radius:7px; border:1px solid var(--border); background:var(--card); color:var(--text); min-width:100px; }
.form-textarea { width:100%; font-size:12px; padding:6px 10px; border-radius:7px; border:1px solid var(--border); background:var(--card); color:var(--text); resize:vertical; min-height:56px; font-family:inherit; }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; display:none; align-items:center; justify-content:center; }
.modal-overlay.open { display:flex; }
.modal { background:var(--card); border-radius:14px; padding:22px; width:460px; max-width:95vw; box-shadow:0 20px 60px rgba(0,0,0,.2); }
.modal h3 { font-size:15px; font-weight:700; margin-bottom:14px; color:var(--navy); }
.modal-footer { display:flex; gap:7px; justify-content:flex-end; margin-top:14px; }
.empty-state { text-align:center; padding:32px; color:var(--text3); font-size:13px; }
footer { text-align:center; padding:24px; color:var(--text3); font-size:11px; }
</style>
</head>
<body>
<div class="app-header">
  <div class="logo-bar"></div>
  <h1>인사팀 업무 캘린더</h1>
  <div class="header-right">
    <span class="sync-status ok" id="sync-status">● 연결됨</span>
    <span class="header-badge">메가인포에셋 인사팀</span>
    <button class="btn btn-primary" onclick="openCatModal()">+ 구분 추가</button>
  </div>
</div>

<div class="container">
  <div class="month-tabs" id="month-tabs"></div>
  <div class="toolbar">
    <input class="search-input" type="text" id="search-input" placeholder="🔍 업무 검색..." oninput="render()">
    <select class="filter-sel" id="filter-done" onchange="render()">
      <option value="">전체</option>
      <option value="todo">미완료만</option>
      <option value="done">완료만</option>
    </select>
    <button class="btn" onclick="allDone(true)">전체 완료</button>
    <button class="btn" onclick="allDone(false)">전체 미완료</button>
  </div>
  <div class="progress-info"><span id="prog-text">0/0</span><span id="prog-pct">0%</span></div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:0%"></div></div>
  <div id="task-container"></div>
</div>

<div class="modal-overlay" id="cat-modal">
  <div class="modal">
    <h3>구분 추가</h3>
    <input class="form-input" id="new-cat-name" placeholder="구분명" style="width:100%;margin-bottom:8px">
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('cat-modal')">취소</button>
      <button class="btn btn-primary" onclick="addCategory()">추가</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3>업무 편집</h3>
    <div class="form-row">
      <input class="form-input" id="edit-title" placeholder="업무명" style="flex:2">
      <select class="form-input" id="edit-badge" style="flex:0 0 80px">
        <option value="regular">정기</option>
        <option value="special">특별</option>
        <option value="monthly">매월</option>
      </select>
    </div>
    <textarea class="form-textarea" id="edit-detail" placeholder="상세 내용"></textarea>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('edit-modal')">취소</button>
      <button class="btn btn-primary" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<footer>메가인포에셋 인사팀 · 업무 캘린더 · 데이터는 실시간 공유됩니다</footer>

// ── Supabase API ───────────────────────────────────────────
async function sbGet(){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/hr_calendar?id=eq.main&select=data`,{
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
  });
  const rows=await res.json();
  return rows[0]?.data||null;
}

async function sbSet(data){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/hr_calendar?id=eq.main`,{
    method:'PATCH',
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({data, updated_at:new Date().toISOString()})
  });
  return res.ok;
}

// ── 상태 ──────────────────────────────────────────────────
let data=null, currentMonth='2026-06', editTarget=null, saveTimer=null;

function setStatus(type,msg){
  const el=document.getElementById('sync-status');
  el.className='sync-status '+type;
  el.textContent=msg;
}

// 현재 월 자동
function getCurMonth(){
  const n=new Date(), k=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');
  return MONTHS.includes(k)?k:'2026-06';
}
currentMonth=getCurMonth();

// 로드
async function loadData(){
  setStatus('saving','● 로딩 중...');
  try{
    const remote=await sbGet();
    if(remote && remote.categories){
      data=remote;
      setStatus('ok','● 연결됨');
    } else {
      // 초기 데이터 저장
      data=JSON.parse(JSON.stringify(INIT_DATA));
      await sbSet(data);
      setStatus('ok','● 연결됨');
    }
  }catch(e){
    data=JSON.parse(JSON.stringify(INIT_DATA));
    setStatus('err','● 오프라인');
  }
  renderMonthTabs();
  render();
}

// 저장 (디바운스)
function saveData(){
  setStatus('saving','● 저장 중...');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      const ok=await sbSet(data);
      setStatus(ok?'ok':'err', ok?'● 저장됨':'● 저장 실패');
      setTimeout(()=>setStatus('ok','● 연결됨'),2000);
    }catch(e){ setStatus('err','● 저장 실패'); }
  },500);
}

// ── 렌더 ──────────────────────────────────────────────────
function getMonthTasks(month){
  const t=[];
  for(const c of data.categories) ((data.tasks[c.id]||{})[month]||[]).forEach(x=>t.push({...x,catId:c.id}));
  return t;
}

function renderMonthTabs(){
  document.getElementById('month-tabs').innerHTML=MONTHS.map(m=>{
    const label=m.replace('-','년 ')+'월';
    const hasDone=getMonthTasks(m).some(t=>t.done);
    return `<button class="month-tab${m===currentMonth?' active':''}${hasDone?' has-done':''}" onclick="selectMonth('${m}')">${label}</button>`;
  }).join('');
}

function selectMonth(m){ currentMonth=m; renderMonthTabs(); render(); }

function updateProgress(){
  const tasks=getMonthTasks(currentMonth);
  const total=tasks.length, done=tasks.filter(t=>t.done).length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('prog-text').textContent=`${done} / ${total} 완료`;
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('prog-bar').style.width=pct+'%';
}

function render(){
  const container=document.getElementById('task-container');
  const search=document.getElementById('search-input').value.toLowerCase();
  const filter=document.getElementById('filter-done').value;
  let html='';
  for(const cat of data.categories){
    const allT=(data.tasks[cat.id]||{})[currentMonth]||[];
    const tasks=allT.filter(t=>{
      if(search&&!t.title.toLowerCase().includes(search)&&!(t.detail||'').toLowerCase().includes(search)) return false;
      if(filter==='done'&&!t.done) return false;
      if(filter==='todo'&&t.done) return false;
      return true;
    });
    const isCol=data.collapsed[cat.id];
    const doneC=allT.filter(t=>t.done).length;
    html+=`<div class="category-section">
      <div class="category-header" onclick="toggleCat('${cat.id}')">
        <span class="cat-title">${cat.name}</span>
        <span class="cat-count">${doneC}/${allT.length}</span>
        <button class="cat-btn" onclick="event.stopPropagation();openAddForm('${cat.id}')">+ 추가</button>
        <button class="cat-btn" onclick="event.stopPropagation();deleteCat('${cat.id}')">삭제</button>
        <span style="color:#A8D4FF;font-size:11px;">${isCol?'▶':'▼'}</span>
      </div>`;
    if(!isCol){
      html+=`<div class="task-list">`;
      if(!tasks.length) html+=`<div class="empty-state">이 월에 해당 업무가 없습니다</div>`;
      else tasks.forEach(t=>{
        const bc=t.badge==='monthly'?'b-monthly':t.badge==='special'?'b-special':'b-regular';
        const bl=t.badge==='monthly'?'매월':t.badge==='special'?'특별':'정기';
        html+=`<div class="task-item${t.done?' done':''}">
          <div class="task-check${t.done?' checked':''}" onclick="toggleDone('${cat.id}','${t.id}')"></div>
          <div class="task-body">
            <div class="task-header">
              <span class="task-title">${t.title}</span>
              <span class="task-badge ${bc}">${bl}</span>
            </div>
            ${t.detail?`<div class="task-detail">${t.detail}</div>`:''}
          </div>
          <div class="task-actions">
            <button class="tact-btn" onclick="openEdit('${cat.id}','${t.id}')">편집</button>
            <button class="tact-btn del" onclick="deleteTask('${cat.id}','${t.id}')">삭제</button>
          </div>
        </div>`;
      });
      html+=`<div class="add-form" id="af-${cat.id}">
        <div class="form-row">
          <input class="form-input" id="at-${cat.id}" placeholder="업무명" style="flex:2">
          <select class="form-input" id="ab-${cat.id}" style="flex:0 0 76px">
            <option value="regular">정기</option>
            <option value="special">특별</option>
            <option value="monthly">매월</option>
          </select>
        </div>
        <textarea class="form-textarea" id="ad-${cat.id}" placeholder="상세 내용 (선택)"></textarea>
        <div style="display:flex;gap:6px;margin-top:7px;">
          <button class="btn btn-primary" onclick="addTask('${cat.id}')">추가</button>
          <button class="btn" onclick="closeAddForm('${cat.id}')">취소</button>
        </div>
      </div></div>`;
    }
    html+=`</div>`;
  }
  container.innerHTML=html||'<div class="empty-state">업무가 없습니다</div>';
  updateProgress();
  renderMonthTabs();
}

// ── 액션 ──────────────────────────────────────────────────
function toggleCat(id){ data.collapsed[id]=!data.collapsed[id]; saveData(); render(); }

function toggleDone(catId,taskId){
  const t=((data.tasks[catId]||{})[currentMonth]||[]).find(t=>t.id===taskId);
  if(t){ t.done=!t.done; saveData(); render(); }
}

function allDone(done){
  for(const c of data.categories) ((data.tasks[c.id]||{})[currentMonth]||[]).forEach(t=>t.done=done);
  saveData(); render();
}

function openAddForm(catId){
  document.querySelectorAll('.add-form').forEach(f=>f.classList.remove('open'));
  const f=document.getElementById('af-'+catId);
  if(f){ f.classList.add('open'); document.getElementById('at-'+catId).focus(); }
}
function closeAddForm(catId){ const f=document.getElementById('af-'+catId); if(f)f.classList.remove('open'); }

function addTask(catId){
  const title=document.getElementById('at-'+catId).value.trim();
  if(!title){ alert('업무명을 입력해주세요.'); return; }
  const badge=document.getElementById('ab-'+catId).value;
  const detail=document.getElementById('ad-'+catId).value.trim();
  if(!data.tasks[catId]) data.tasks[catId]={};
  if(!data.tasks[catId][currentMonth]) data.tasks[catId][currentMonth]=[];
  data.tasks[catId][currentMonth].push({id:'t'+Date.now(),title,badge,detail,done:false});
  saveData(); render();
}

function deleteTask(catId,taskId){
  if(!confirm('삭제하시겠습니까?')) return;
  const tasks=(data.tasks[catId]||{})[currentMonth]||[];
  const idx=tasks.findIndex(t=>t.id===taskId);
  if(idx>=0){ tasks.splice(idx,1); saveData(); render(); }
}

function openEdit(catId,taskId){
  const t=((data.tasks[catId]||{})[currentMonth]||[]).find(t=>t.id===taskId);
  if(!t) return;
  editTarget={catId,taskId};
  document.getElementById('edit-title').value=t.title;
  document.getElementById('edit-badge').value=t.badge;
  document.getElementById('edit-detail').value=t.detail||'';
  document.getElementById('edit-modal').classList.add('open');
}

function saveEdit(){
  if(!editTarget) return;
  const {catId,taskId}=editTarget;
  const t=((data.tasks[catId]||{})[currentMonth]||[]).find(t=>t.id===taskId);
  if(t){
    t.title=document.getElementById('edit-title').value.trim();
    t.badge=document.getElementById('edit-badge').value;
    t.detail=document.getElementById('edit-detail').value.trim();
    saveData(); render();
  }
  closeModal('edit-modal'); editTarget=null;
}

function openCatModal(){ document.getElementById('new-cat-name').value=''; document.getElementById('cat-modal').classList.add('open'); setTimeout(()=>document.getElementById('new-cat-name').focus(),100); }

function addCategory(){
  const name=document.getElementById('new-cat-name').value.trim();
  if(!name){ alert('구분명을 입력해주세요.'); return; }
  data.categories.push({id:'c'+Date.now(),name});
  saveData(); closeModal('cat-modal'); render();
}

function deleteCat(catId){
  if(!confirm('구분을 삭제하면 해당 구분의 모든 업무도 삭제됩니다. 계속하시겠습니까?')) return;
  data.categories=data.categories.filter(c=>c.id!==catId);
  delete data.tasks[catId];
  saveData(); render();
}

function closeModal(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o) o.classList.remove('open'); }));

// ── 시작 ──────────────────────────────────────────────────
loadData();
</script>
</body>
</html>

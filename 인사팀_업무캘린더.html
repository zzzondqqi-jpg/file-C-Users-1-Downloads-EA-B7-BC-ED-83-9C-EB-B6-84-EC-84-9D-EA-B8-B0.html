<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인사팀 업무 캘린더</title>
<style>
:root {
  --navy: #0F1C2E;
  --navy2: #1A2E45;
  --navy3: #243B55;
  --slate: #334E68;
  --accent: #4E9AF1;
  --bg: #F0F4F8;
  --card: #FFFFFF;
  --border: #D9E2EC;
  --text: #1A2E45;
  --text2: #486581;
  --text3: #829AB1;
  --row-alt: #F7FAFC;
  --done-bg: #F0FFF4;
  --done-text: #276749;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

.app-header { background: var(--navy); padding: 0 32px; display: flex; align-items: center; gap: 14px; height: 56px; }
.logo-bar { width: 3px; height: 28px; background: linear-gradient(180deg, #4E9AF1, #7BB8F5); border-radius: 2px; }
.app-header h1 { color: #fff; font-size: 17px; font-weight: 600; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.header-badge { font-size: 11px; color: #A8D4FF; background: rgba(78,154,241,0.15); padding: 3px 10px; border-radius: 100px; border: 1px solid rgba(78,154,241,0.2); }

.container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }

/* 월 탭 */
.month-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.month-tab { font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 100px; border: 1.5px solid var(--border); background: var(--card); color: var(--text2); cursor: pointer; transition: all 0.1s; }
.month-tab:hover { border-color: var(--accent); color: var(--accent); }
.month-tab.active { background: var(--navy2); color: #fff; border-color: var(--navy2); }
.month-tab.has-done { position: relative; }
.month-tab.has-done::after { content: ''; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; background: #48BB78; border-radius: 50%; }

/* 툴바 */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.toolbar-left { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
.search-input { font-size: 13px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); width: 200px; }
.filter-sel { font-size: 12px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text2); }

/* 버튼 */
.btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text2); transition: all 0.1s; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn-primary { background: var(--navy2); color: #fff; border-color: var(--navy2); }
.btn-primary:hover { background: var(--navy3); }
.btn-success { background: #276749; color: #fff; border-color: #276749; }

/* 진행률 */
.progress-bar-wrap { background: #E2E8F0; border-radius: 100px; height: 6px; margin-bottom: 20px; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, #4E9AF1, #48BB78); border-radius: 100px; transition: width 0.3s; }
.progress-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--text3); margin-bottom: 6px; }

/* 카드 */
.category-section { margin-bottom: 16px; }
.category-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--navy2); border-radius: 10px 10px 0 0; cursor: pointer; user-select: none; }
.category-title { font-size: 13px; font-weight: 700; color: #fff; }
.category-count { font-size: 11px; color: var(--accent); background: rgba(78,154,241,0.15); padding: 2px 8px; border-radius: 100px; margin-left: auto; }
.category-toggle { color: #A8D4FF; font-size: 12px; }

.task-list { border: 1px solid var(--border); border-top: none; border-radius: 0 0 10px 10px; overflow: hidden; }
.task-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--card); transition: background 0.1s; }
.task-item:last-child { border-bottom: none; }
.task-item:hover { background: #F7FAFC; }
.task-item.done { background: var(--done-bg); }
.task-item.done .task-title { text-decoration: line-through; color: var(--text3); }
.task-item.done .task-detail { color: #9AE6B4; }

/* 체크박스 */
.task-check { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--border); background: var(--card); cursor: pointer; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all 0.1s; }
.task-check.checked { background: #48BB78; border-color: #48BB78; }
.task-check.checked::after { content: '✓'; color: #fff; font-size: 11px; font-weight: 700; }

.task-body { flex: 1; min-width: 0; }
.task-header { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; flex-wrap: wrap; }
.task-title { font-size: 13px; font-weight: 600; color: var(--text); }
.task-badge { font-size: 10px; padding: 1px 7px; border-radius: 100px; font-weight: 600; }
.badge-regular { background: #EBF8FF; color: #2B6CB0; border: 1px solid #BEE3F8; }
.badge-special { background: #FFF5F5; color: #C53030; border: 1px solid #FED7D7; }
.badge-monthly { background: #F0FFF4; color: #276749; border: 1px solid #9AE6B4; }
.task-detail { font-size: 12px; color: var(--text2); line-height: 1.5; white-space: pre-wrap; }

.task-actions { display: flex; gap: 4px; flex-shrink: 0; opacity: 0; transition: opacity 0.1s; }
.task-item:hover .task-actions { opacity: 1; }
.task-action-btn { font-size: 11px; padding: 3px 8px; border-radius: 5px; border: 1px solid var(--border); background: var(--card); cursor: pointer; color: var(--text3); }
.task-action-btn:hover { background: var(--bg); color: var(--text); }
.task-action-btn.del:hover { background: #FFF5F5; color: #C53030; border-color: #FED7D7; }

/* 추가 폼 */
.add-task-form { padding: 12px 16px; background: #F7FAFC; border: 1px solid var(--border); border-top: none; border-radius: 0 0 10px 10px; display: none; }
.add-task-form.open { display: block; }
.form-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.form-input { flex: 1; font-size: 13px; padding: 7px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--card); color: var(--text); min-width: 120px; }
.form-textarea { width: 100%; font-size: 12px; padding: 7px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--card); color: var(--text); resize: vertical; min-height: 60px; font-family: inherit; }

/* 모달 */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; display: none; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--card); border-radius: 14px; padding: 24px; width: 480px; max-width: 95vw; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.modal h3 { font-size: 15px; font-weight: 700; margin-bottom: 16px; color: var(--navy); }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

.empty-state { text-align: center; padding: 40px; color: var(--text3); font-size: 13px; }

footer { text-align: center; padding: 28px; color: var(--text3); font-size: 11px; }
</style>
</head>

<div class="app-header">
  <div class="logo-bar"></div>
  <h1>인사팀 업무 캘린더</h1>
  <div class="header-right">
    <span class="header-badge">메가인포에셋 인사팀</span>
    <button class="btn btn-primary" onclick="openAddCategoryModal()">+ 구분 추가</button>
  </div>
</div>

<div class="container">
  <!-- 월 탭 -->
  <div class="month-tabs" id="month-tabs"></div>

  <!-- 툴바 -->
  <div class="toolbar">
    <div class="toolbar-left">
      <input class="search-input" type="text" id="search-input" placeholder="🔍 업무 검색..." oninput="renderTasks()">
      <select class="filter-sel" id="filter-done" onchange="renderTasks()">
        <option value="">전체</option>
        <option value="todo">미완료만</option>
        <option value="done">완료만</option>
      </select>
    </div>
    <button class="btn" onclick="toggleAllDone()">전체 완료 처리</button>
    <button class="btn" onclick="toggleAllUndone()">전체 미완료로</button>
  </div>

  <!-- 진행률 -->
  <div class="progress-info">
    <span id="progress-text">0 / 0 완료</span>
    <span id="progress-pct">0%</span>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
  </div>

  <!-- 업무 목록 -->
  <div id="task-container"></div>
</div>

<!-- 구분 추가 모달 -->
<div class="modal-overlay" id="category-modal">
  <div class="modal">
    <h3>구분 추가</h3>
    <div class="form-row">
      <input class="form-input" id="new-category-name" placeholder="구분명 (예: 인사/노무)" style="flex:1">
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('category-modal')">취소</button>
      <button class="btn btn-primary" onclick="addCategory()">추가</button>
    </div>
  </div>
</div>

<!-- 업무 편집 모달 -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3>업무 편집</h3>
    <div class="form-row">
      <input class="form-input" id="edit-title" placeholder="업무명" style="flex:1">
      <select class="form-input" id="edit-badge" style="flex:0 0 100px">
        <option value="regular">정기</option>
        <option value="special">특별</option>
        <option value="monthly">매월</option>
      </select>
    </div>
    <textarea class="form-textarea" id="edit-detail" placeholder="상세 내용"></textarea>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('edit-modal')">취소</button>
      <button class="btn btn-primary" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

// 데이터 로드/저장
function load(){
  try{ return JSON.parse(localStorage.getItem(STORE)) || JSON.parse(JSON.stringify(INIT_DATA)); }
  catch(e){ return JSON.parse(JSON.stringify(INIT_DATA)); }
}
function save(data){ localStorage.setItem(STORE, JSON.stringify(data)); }

let data = load();
let currentMonth = '2026-06'; // 현재 월 기본값
let editTarget = null;

// 현재 월 자동 설정
function getCurrentMonth(){
  const now = new Date();
  const key = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  return MONTHS.includes(key) ? key : '2026-06';
}
currentMonth = getCurrentMonth();

// 월 탭 렌더
function renderMonthTabs(){
  const tabs = document.getElementById('month-tabs');
  tabs.innerHTML = MONTHS.map(m=>{
    const label = m.replace('-','년 ')+'월';
    const tasks = getMonthTasks(m);
    const hasDone = tasks.some(t=>t.done);
    return `<button class="month-tab${m===currentMonth?' active':''}${hasDone?' has-done':''}" onclick="selectMonth('${m}')">${label}</button>`;
  }).join('');
}

function selectMonth(m){
  currentMonth = m;
  renderMonthTabs();
  renderTasks();
}

// 해당 월의 모든 태스크 가져오기
function getMonthTasks(month){
  const tasks=[];
  for(const cat of data.categories){
    const catTasks=(data.tasks[cat.id]||{})[month]||[];
    catTasks.forEach(t=>tasks.push({...t, catId:cat.id}));
  }
  return tasks;
}

// 진행률 업데이트
function updateProgress(){
  const tasks = getMonthTasks(currentMonth);
  const total = tasks.length;
  const done = tasks.filter(t=>t.done).length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progress-text').textContent = `${done} / ${total} 완료`;
  document.getElementById('progress-pct').textContent = pct+'%';
  document.getElementById('progress-bar').style.width = pct+'%';
}

// 태스크 렌더
function renderTasks(){
  const container = document.getElementById('task-container');
  const search = document.getElementById('search-input').value.toLowerCase();
  const filter = document.getElementById('filter-done').value;
  let html = '';

  for(const cat of data.categories){
    const allTasks = (data.tasks[cat.id]||{})[currentMonth]||[];
    let tasks = allTasks.filter(t=>{
      if(search && !t.title.toLowerCase().includes(search) && !t.detail.toLowerCase().includes(search)) return false;
      if(filter==='done' && !t.done) return false;
      if(filter==='todo' && t.done) return false;
      return true;
    });

    const isCollapsed = data.collapsed[cat.id];
    const doneCount = allTasks.filter(t=>t.done).length;

    html += `<div class="category-section">
      <div class="category-header" onclick="toggleCategory('${cat.id}')">
        <span class="category-title">${cat.name}</span>
        <span class="category-count">${doneCount}/${allTasks.length}</span>
        <span class="category-toggle">${isCollapsed?'▶':'▼'}</span>
        <button class="btn" style="font-size:11px;padding:3px 8px;margin-left:4px;" onclick="event.stopPropagation();openAddTask('${cat.id}')">+ 추가</button>
        <button class="btn" style="font-size:11px;padding:3px 8px;" onclick="event.stopPropagation();deleteCategory('${cat.id}')">삭제</button>
      </div>`;

    if(!isCollapsed){
      html += `<div class="task-list">`;
      if(tasks.length===0){
        html += `<div class="empty-state">이 월에 해당 업무가 없습니다</div>`;
      } else {
        tasks.forEach(t=>{
          const badge = t.badge==='monthly'?'badge-monthly':t.badge==='special'?'badge-special':'badge-regular';
          const badgeLabel = t.badge==='monthly'?'매월':t.badge==='special'?'특별':'정기';
          html += `<div class="task-item${t.done?' done':''}" id="task-${t.id}">
            <div class="task-check${t.done?' checked':''}" onclick="toggleDone('${cat.id}','${t.id}')"></div>
            <div class="task-body">
              <div class="task-header">
                <span class="task-title">${t.title}</span>
                <span class="task-badge ${badge}">${badgeLabel}</span>
              </div>
              ${t.detail?`<div class="task-detail">${t.detail}</div>`:''}
            </div>
            <div class="task-actions">
              <button class="task-action-btn" onclick="openEditTask('${cat.id}','${t.id}')">편집</button>
              <button class="task-action-btn del" onclick="deleteTask('${cat.id}','${t.id}')">삭제</button>
            </div>
          </div>`;
        });
      }
      // 추가 폼
      html += `<div class="add-task-form" id="add-form-${cat.id}">
        <div class="form-row">
          <input class="form-input" id="add-title-${cat.id}" placeholder="업무명" style="flex:2">
          <select class="form-input" id="add-badge-${cat.id}" style="flex:0 0 80px">
            <option value="regular">정기</option>
            <option value="special">특별</option>
            <option value="monthly">매월</option>
          </select>
        </div>
        <textarea class="form-textarea" id="add-detail-${cat.id}" placeholder="상세 내용 (선택)"></textarea>
        <div style="display:flex;gap:6px;margin-top:8px;">
          <button class="btn btn-primary" onclick="addTask('${cat.id}')">추가</button>
          <button class="btn" onclick="closeAddTask('${cat.id}')">취소</button>
        </div>
      </div>`;
      html += `</div>`;
    }
    html += `</div>`;
  }

  container.innerHTML = html || '<div class="empty-state">업무가 없습니다</div>';
  updateProgress();
  renderMonthTabs();
}

function toggleCategory(catId){
  data.collapsed[catId] = !data.collapsed[catId];
  save(data);
  renderTasks();
}

function toggleDone(catId, taskId){
  const tasks = (data.tasks[catId]||{})[currentMonth]||[];
  const t = tasks.find(t=>t.id===taskId);
  if(t){ t.done=!t.done; save(data); renderTasks(); }
}

function toggleAllDone(){
  for(const cat of data.categories){
    const tasks=(data.tasks[cat.id]||{})[currentMonth]||[];
    tasks.forEach(t=>t.done=true);
  }
  save(data); renderTasks();
}
function toggleAllUndone(){
  for(const cat of data.categories){
    const tasks=(data.tasks[cat.id]||{})[currentMonth]||[];
    tasks.forEach(t=>t.done=false);
  }
  save(data); renderTasks();
}

function openAddTask(catId){
  document.querySelectorAll('.add-task-form').forEach(f=>f.classList.remove('open'));
  const form = document.getElementById('add-form-'+catId);
  if(form){ form.classList.add('open'); document.getElementById('add-title-'+catId).focus(); }
}
function closeAddTask(catId){
  const form = document.getElementById('add-form-'+catId);
  if(form) form.classList.remove('open');
}

function addTask(catId){
  const title = document.getElementById('add-title-'+catId).value.trim();
  if(!title){ alert('업무명을 입력해주세요.'); return; }
  const badge = document.getElementById('add-badge-'+catId).value;
  const detail = document.getElementById('add-detail-'+catId).value.trim();
  if(!data.tasks[catId]) data.tasks[catId]={};
  if(!data.tasks[catId][currentMonth]) data.tasks[catId][currentMonth]=[];
  data.tasks[catId][currentMonth].push({
    id:'t'+Date.now(), title, badge, detail, done:false
  });
  save(data); renderTasks();
}

function deleteTask(catId, taskId){
  if(!confirm('삭제하시겠습니까?')) return;
  const tasks=(data.tasks[catId]||{})[currentMonth]||[];
  const idx=tasks.findIndex(t=>t.id===taskId);
  if(idx>=0){ tasks.splice(idx,1); save(data); renderTasks(); }
}

function openEditTask(catId, taskId){
  const tasks=(data.tasks[catId]||{})[currentMonth]||[];
  const t=tasks.find(t=>t.id===taskId);
  if(!t) return;
  editTarget={catId,taskId};
  document.getElementById('edit-title').value=t.title;
  document.getElementById('edit-badge').value=t.badge;
  document.getElementById('edit-detail').value=t.detail;
  document.getElementById('edit-modal').classList.add('open');
}

function saveEdit(){
  if(!editTarget) return;
  const {catId,taskId}=editTarget;
  const tasks=(data.tasks[catId]||{})[currentMonth]||[];
  const t=tasks.find(t=>t.id===taskId);
  if(t){
    t.title=document.getElementById('edit-title').value.trim();
    t.badge=document.getElementById('edit-badge').value;
    t.detail=document.getElementById('edit-detail').value.trim();
    save(data); renderTasks();
  }
  closeModal('edit-modal');
  editTarget=null;
}

function openAddCategoryModal(){
  document.getElementById('new-category-name').value='';
  document.getElementById('category-modal').classList.add('open');
  document.getElementById('new-category-name').focus();
}

function addCategory(){
  const name=document.getElementById('new-category-name').value.trim();
  if(!name){ alert('구분명을 입력해주세요.'); return; }
  data.categories.push({id:'c'+Date.now(), name});
  save(data);
  closeModal('category-modal');
  renderTasks();
}

function deleteCategory(catId){
  if(!confirm('구분을 삭제하면 해당 구분의 모든 업무도 삭제됩니다. 계속하시겠습니까?')) return;
  data.categories=data.categories.filter(c=>c.id!==catId);
  delete data.tasks[catId];
  save(data); renderTasks();
}

function closeModal(id){
  document.getElementById(id).classList.remove('open');
}

// 모달 외부 클릭 시 닫기
document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',e=>{ if(e.target===o) o.classList.remove('open'); });
});

// 초기 렌더
renderMonthTabs();
renderTasks();
</script>
